<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>NewsPortal</title>
</head>

<body>
    <header>
        <h1>News Portal</h1>
    </header>
    <main class="main">
        <div class="sources-container">
            <div class="sources buttons"></div>
            <div class="pagination" id="pagination">
                <button class="pagination-btn pagination-prev" type="button" aria-label="previous page">←</button>
                <span class="pagination-current">1</span>
                <button class="pagination-btn pagination-next" type="button" aria-label="next page">→</button>
            </div>
        </div>
        <div class="news"></div>
    </main>
    <footer class="footer">
            <p class="footer-copyright">
                Copyright <a href="https://newsapi.org" class="footer-link" target="_blank" rel="noopener noreferrer">NewsAPI</a>
            </p>
            <div class="footer-item">
                <a href="https://github.com/evoly/" target="_blank" rel="noopener noreferrer" class="footer-link">
                    <img src="./images/github.svg" class="footer-img" alt="GitHub logo" />
                </a>
            </div>
            <div class="footer-item ">
                <span>2026</span>
            </div>
            <div class="footer-item ">
                <a href="https://rs.school/courses/javascript" class="footer-link" target="_blank"
                    rel="noopener noreferrer">
                    <img src="./images/rs_school_js.svg " class="footer-img" alt="rsschool logo">
                </a>
            </div>
    </footer>

    <template id="sourceItemTemp">
        <div class="source__item">
            <span class="source__item-name"></span>
        </div>
    </template>

    <template id="newsItemTemp">
        <div class="news__item">
            <div class="news__meta">
                <div class="news__meta-photo"></div>
                <ul class="news__meta-details">
                    <li class="news__meta-author"></li>
                    <li class="news__meta-date"></li>
                </ul>
            </div>
            <div class="news__description">
                <h2 class="news__description-title"></h2>
                <h3 class="news__description-source"></h3>
                <p class="news__description-content"></p>
                <p class="news__read-more">
                    <a href="#">Read More</a>
                </p>
            </div>
        </div>
    </template>
</body>

</html>
